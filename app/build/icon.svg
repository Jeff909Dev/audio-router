<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The OUT to IN patch cable from PatchCable.tsx on a rack faceplate, turned so the
       cable loops back from OUT (top jack) to IN (bottom jack). Apple's macOS icon grid:
       an 824 px body inset 100 px. Rebuild icon.icns with scripts/make-icon.sh. -->
  <defs>
    <linearGradient id="faceplate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1e21"/>
      <stop offset="1" stop-color="#0d0e0f"/>
    </linearGradient>
    <radialGradient id="wash" cx="330" cy="512" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0a43c" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f0a43c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#faceplate)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#wash)"/>

    <!-- rack screws -->
    <g fill="#09090a" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3">
      <circle cx="214" cy="214" r="17"/>
      <circle cx="810" cy="214" r="17"/>
      <circle cx="214" cy="810" r="17"/>
      <circle cx="810" cy="810" r="17"/>
    </g>
    <path d="M 205 214 H 223 M 801 214 H 819 M 205 810 H 223 M 801 810 H 819"
          fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4" stroke-linecap="round"/>

    <!-- cable: shadow, glow, core, sheen -->
    <path d="M 520 330 C 150 330, 150 694, 520 694" transform="translate(0 12)" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="62" stroke-linecap="round" filter="url(#soft)"/>
    <path d="M 520 330 C 150 330, 150 694, 520 694" fill="none" stroke="#f0a43c" stroke-opacity="0.6" stroke-width="66" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 520 330 C 150 330, 150 694, 520 694" fill="none" stroke="#f0a43c" stroke-width="48" stroke-linecap="round"/>
    <path d="M 520 330 C 150 330, 150 694, 520 694" transform="translate(5 -10)" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="9" stroke-linecap="round"/>

    <!-- OUT jack (top) and IN jack (bottom), each with its plug -->
    <g transform="translate(680 330)">
      <circle r="104" fill="#1b1c1f" stroke="#ffffff" stroke-opacity="0.14" stroke-width="5"/>
      <circle r="74" fill="#24252a" stroke="#000000" stroke-opacity="0.6" stroke-width="5"/>
      <circle r="34" fill="#040404"/>
      <rect x="-196" y="-40" width="132" height="80" rx="16" fill="#2e2f33" stroke="#ffffff" stroke-opacity="0.16" stroke-width="5"/>
      <path d="M -160 -20 V 20 M -134 -20 V 20 M -108 -20 V 20" fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g transform="translate(680 694)">
      <circle r="104" fill="#1b1c1f" stroke="#ffffff" stroke-opacity="0.14" stroke-width="5"/>
      <circle r="74" fill="#24252a" stroke="#000000" stroke-opacity="0.6" stroke-width="5"/>
      <circle r="34" fill="#040404"/>
      <rect x="-196" y="-40" width="132" height="80" rx="16" fill="#2e2f33" stroke="#ffffff" stroke-opacity="0.16" stroke-width="5"/>
      <path d="M -160 -20 V 20 M -134 -20 V 20 M -108 -20 V 20" fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- faceplate edge -->
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="4"/>
</svg>
