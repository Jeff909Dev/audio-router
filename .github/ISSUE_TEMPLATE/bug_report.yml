name: Bug report
description: Something in Audio Router does not work as described.
labels: [bug]
body:
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu > About This Mac, for example "macOS 26.1".
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Chip
      options:
        - Apple silicon (M1 or later)
        - Intel
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Audio Router version
      description: The release you downloaded (for example 0.1.0), or the commit if you built it yourself.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: arctl
    attributes:
      label: arctl list output
      description: |
        Run this in Terminal and paste the output. It lists your audio devices as Core Audio sees them.
        Device names can include your name (for example "Alex's AirPods"), so edit those out if you prefer.

        "/Applications/Audio Router.app/Contents/Resources/arctl" list

        If you built from source, run `helper/build/arctl list` in the repo instead.
      render: json
    validations:
      required: true
